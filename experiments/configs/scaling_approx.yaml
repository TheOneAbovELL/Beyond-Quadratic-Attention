# threads=1: these runs were made while other workloads on this machine kept ~12 logical CPUs busy; single-threaded
# runs avoid OpenMP barrier stalls from descheduled threads, so contention degrades methods more evenly.
# E2: When do restricted / linear methods save time and memory relative to the best exact kernel?
name: scaling_approx
hypothesis: >
  local_window (w=64), block_sparse (b=64, 1 local + 1 global + 1 random block) and linear_elu
  grow ~linearly in L, so they overtake the fused exact kernel beyond some crossover length.
  At short L their constant-factor overhead (padding, gather, extra kernels) can make them slower.
methods:
  - sdpa_flash_cpu
  - {name: local_window, params: {window: 64}}
  - {name: block_sparse, params: {block_size: 64, local_blocks: 1, global_blocks: 1, random_blocks: 1}}
  - linear_elu
grid: {B: [1], H: [4], L: [256, 512, 1024, 2048, 4096, 8192, 16384], d: [64], dtype: [float32], causal: [false, true], threads: [1]}
warmup: 2
repeats: 7
max_seconds_per_mode: 30
stop_if_slower_than_s: 8.0
mem_fraction: 0.5
max_mem_gb: 2.5
measure_error: true
isolate: true
# Before each config, wait (bounded) for other processes to go quiet; load is recorded either way.
wait_for_quiet: {max_other_cores: 3.0, timeout_s: 10}
